<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>J.A.R.V.I.S</h1>
        <p>PERSONAL AI ASSISTANT</p>
    </header>

    <div class="core">
        <div class="ring ring1"></div>
        <div class="ring ring2"></div>
        <div class="center"></div>
    </div>

    <h2 id="status">SYSTEM READY</h2>

    <div class="chat" id="chat">
        <div class="message bot">
            Hello! I am J.A.R.V.I.S. How can I help you?
        </div>
    </div>

    <div class="input-area">
        <input
            type="text"
            id="msg"
            placeholder="Ask JARVIS something..."
        >

        <button id="send">SEND</button>
        <button id="mic-btn">🎙️</button>
        <button id="cam-btn">📷</button>

        <input
            type="file"
            id="img-input"
            accept="image/*"
            capture="environment"
            hidden
        >
    </div>

    <button id="clear-btn">CLEAR MEMORY</button>

    <script src="script.js"></script>
</body>
</html>
